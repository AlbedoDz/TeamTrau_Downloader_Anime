<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeamTrau Download Manager v2.0+ (IDM Edition)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B0F17',
            brandSurface: '#161F30',
            brandCard: '#131C2D',
            brandEmerald: '#10B981',
            brandCyan: '#06B6D4',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  
  <!-- Custom Design Tokens Stylesheet -->
  <link rel="stylesheet" href="./tokens/tokens.css" />
  
  <!-- React 18 & Babel Standalone for Instant Local Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0B0F17] text-slate-100 font-sans antialiased overflow-hidden min-h-screen">
  <div id="root"></div>

  <!-- Interactive Dynamic IDM Download Manager Frontend -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SITE_PRESETS = [
      { id: 'allwish', name: 'AllWish', color: 'text-purple-400 border-purple-500/40 bg-purple-950/40', sample: 'https://all-wish.me/watch/world-is-dancing-mof9c/ep-8' },
      { id: 'anikoto', name: 'AniKotoTV', color: 'text-emerald-400 border-emerald-500/40 bg-emerald-950/40', sample: 'https://anikototv.to/watch/solo-leveling-season-2-arise-from-the-shadow-v0kw5/ep-1' },
      { id: 'animesuge', name: 'AnimeSuge', color: 'text-cyan-400 border-cyan-500/40 bg-cyan-950/40', sample: 'https://animesuge.cz/anime/world-is-dancing-wt8rp/ep-4' },
      { id: 'animecube', name: 'AnimeCube', color: 'text-amber-400 border-amber-500/40 bg-amber-950/40', sample: 'https://animecube.live/watch/one-piece/ep-1' }
    ];

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${sizes[i]}`;
    }

    function App() {
      // Data State
      const [tasks, setTasks] = useState([]);
      const [counts, setCounts] = useState({ all: 0, downloading: 0, queued: 0, completed: 0, paused: 0, failed: 0 });
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [systemLogs, setSystemLogs] = useState([]);
      const [isBackendConnected, setIsBackendConnected] = useState(false);

      // UI States
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isConsoleOpen, setIsConsoleOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [taskDetail, setTaskDetail] = useState(null);
      const [taskLogs, setTaskLogs] = useState([]);
      const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, task: null });

      // Add URL Form State
      const [url, setUrl] = useState('');
      const [isBatchText, setIsBatchText] = useState(false);
      const [multiUrlsText, setMultiUrlsText] = useState('');
      const [isParsing, setIsParsing] = useState(false);
      const [parseError, setParseError] = useState(null);
      const [parsedData, setParsedData] = useState(null);

      // Add Options State
      const [downloadMode, setDownloadMode] = useState('full');
      const [rangeInput, setRangeInput] = useState('all');
      const [selectedQuality, setSelectedQuality] = useState('1080p');
      const [selectedLangs, setSelectedLangs] = useState(['es-LA', 'en']);
      const [namingFormat, setNamingFormat] = useState('simple');
      const [tvdbId, setTvdbId] = useState('');
      const [showAdvanced, setShowAdvanced] = useState(false);

      // Settings State
      const [settings, setSettings] = useState({
        outputDir: './downloads',
        maxWorkers: 3,
        proxyUrl: '',
      });

      // Poll tasks and status
      const fetchTasks = async () => {
        try {
          let reqUrl = '/api/tasks?';
          if (['queued', 'downloading', 'paused', 'completed', 'failed'].includes(selectedCategory)) {
            reqUrl += `status=${selectedCategory}&`;
          } else if (['anime', 'video', 'subtitle'].includes(selectedCategory)) {
            reqUrl += `category=${selectedCategory}&`;
          }
          if (searchQuery.trim()) {
            reqUrl += `q=${encodeURIComponent(searchQuery.trim())}&`;
          }

          const res = await fetch(reqUrl);
          if (res.ok) {
            const data = await res.json();
            setIsBackendConnected(true);
            if (data.tasks) setTasks(data.tasks);
            if (data.counts) setCounts(data.counts);
          }
        } catch {
          setIsBackendConnected(false);
        }
      };

      const fetchSystemLogs = async () => {
        try {
          const res = await fetch('/api/logs');
          if (res.ok) {
            const data = await res.json();
            if (data.logs) setSystemLogs(data.logs);
          }
        } catch {}
      };

      useEffect(() => {
        fetchTasks();
        fetchSystemLogs();
        const timer = setInterval(() => {
          fetchTasks();
          fetchSystemLogs();
          if (taskDetail) {
            fetch(`/api/tasks/${taskDetail.id}/logs`)
              .then(r => r.json())
              .then(d => { if (d.logs) setTaskLogs(d.logs); })
              .catch(() => {});
          }
        }, 1500);
        return () => clearInterval(timer);
      }, [selectedCategory, searchQuery, taskDetail]);

      // URL Parser
      const handleParse = async (e) => {
        if (e) e.preventDefault();
        if (!url.trim()) return;
        setIsParsing(true);
        setParseError(null);
        try {
          const res = await fetch('/api/parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url.trim() })
          });
          const data = await res.json();
          if (data.success) {
            setParsedData(data);
            setRangeInput(`1-${Math.min(data.totalEpisodes, 12)}`);
          } else {
            setParseError(data.error || 'Không thể trích xuất thông tin anime.');
          }
        } catch (err) {
          setParseError('Lỗi kết nối máy chủ: ' + err.message);
        } finally {
          setIsParsing(false);
        }
      };

      // Add to Queue
      const handleConfirmAdd = async () => {
        if (!parsedData) return;

        let selectedEpNums = [];
        if (rangeInput.trim().toLowerCase() === 'all') {
          selectedEpNums = parsedData.episodes.map(e => e.num);
        } else {
          const parts = rangeInput.split(',').map(p => p.trim());
          for (const part of parts) {
            if (part.includes('-')) {
              const [s, end] = part.split('-').map(n => parseInt(n.trim(), 10));
              if (!isNaN(s) && !isNaN(end)) {
                for (let i = s; i <= end; i++) selectedEpNums.push(String(i));
              }
            } else if (part) {
              selectedEpNums.push(part);
            }
          }
        }

        if (selectedEpNums.length === 0) selectedEpNums = parsedData.episodes.map(e => e.num);

        await fetch('/api/tasks/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: parsedData.rawUrl,
            animeTitle: parsedData.title,
            episodes: selectedEpNums,
            site: parsedData.site,
            quality: selectedQuality,
            downloadMode: downloadMode,
            targetSubLangs: selectedLangs,
            outputDir: settings.outputDir,
          })
        });

        setIsAddModalOpen(false);
        setParsedData(null);
        setUrl('');
        fetchTasks();
      };

      // Task actions
      const taskAction = async (taskId, action, body = {}) => {
        await fetch(`/api/tasks/${taskId}/${action}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        fetchTasks();
      };

      const openInspector = async (task) => {
        setTaskDetail(task);
        try {
          const res = await fetch(`/api/tasks/${task.id}/logs`);
          const data = await res.json();
          if (data.logs) setTaskLogs(data.logs);
        } catch {}
      };

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-[#0B0F17] text-slate-100" onClick={() => setContextMenu({ visible: false, x: 0, y: 0, task: null })}>
          
          {/* Top IDM Application Header */}
          <header className="flex items-center justify-between px-6 py-3 bg-[#131C2D]/95 border-b border-white/10 select-none">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-emerald-500/20">
                TT
              </div>
              <div>
                <h1 className="text-sm font-bold bg-gradient-to-r from-emerald-400 via-cyan-400 to-white bg-clip-text text-transparent">
                  TeamTrau Download Manager
                </h1>
                <span className="text-[10px] font-mono text-slate-400">Desktop Suite v2.0+ (IDM Edition)</span>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-mono border ${
                isBackendConnected
                  ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-300'
                  : 'bg-rose-950/60 border-rose-500/40 text-rose-300'
              }`}>
                <span className={`w-2 h-2 rounded-full ${isBackendConnected ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'}`} />
                {isBackendConnected ? 'ENGINE ONLINE (127.0.0.1:8765)' : 'DISCONNECTED'}
              </span>
            </div>
          </header>

          {/* Manager Toolbar */}
          <div className="flex flex-wrap items-center justify-between gap-3 px-6 py-2.5 bg-[#161F30]/90 border-b border-white/10 select-none">
            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => { setIsAddModalOpen(true); setParsedData(null); }}
                className="flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-white bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 rounded-lg shadow-md shadow-emerald-500/20 active:scale-95 transition-all"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                <span>Thêm URL (+)</span>
              </button>

              <button
                type="button"
                onClick={() => { fetch('/api/queue/resume-all', { method: 'POST' }); fetchTasks(); }}
                className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-200 bg-[#0B0F17] hover:bg-white/10 border border-white/10 rounded-lg transition-all"
              >
                <span className="text-emerald-400 font-bold">▶</span> Tiếp Tục Tất Cả
              </button>

              <button
                type="button"
                onClick={() => { fetch('/api/queue/pause-all', { method: 'POST' }); fetchTasks(); }}
                className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-200 bg-[#0B0F17] hover:bg-white/10 border border-white/10 rounded-lg transition-all"
              >
                <span className="text-amber-400 font-bold">⏸</span> Tạm Dừng
              </button>

              <button
                type="button"
                onClick={() => { fetch('/api/queue/clear-completed', { method: 'POST' }); fetchTasks(); }}
                className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-300 bg-[#0B0F17] hover:bg-white/10 border border-white/10 rounded-lg transition-all"
              >
                <span className="text-cyan-400 font-bold">✓</span> Dọn Đã Xong
              </button>
            </div>

            <div className="flex items-center gap-3">
              <div className="relative">
                <input
                  type="text"
                  placeholder="Tìm kiếm tác vụ..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-48 sm:w-64 bg-[#0B0F17] text-slate-200 text-xs pl-8 pr-3 py-1.5 rounded-lg border border-white/10 focus:border-cyan-400 focus:outline-none"
                />
                <svg className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
              </div>

              <button
                type="button"
                onClick={() => setIsSettingsOpen(true)}
                className="p-1.5 text-slate-300 hover:text-white bg-[#0B0F17] hover:bg-white/10 border border-white/10 rounded-lg transition-all"
                title="Cài đặt hệ thống"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
              </button>
            </div>
          </div>

          {/* Main Content Area: Sidebar + Table */}
          <div className="flex-1 flex overflow-hidden">
            {/* Left Sidebar Categories */}
            <aside className="w-56 shrink-0 bg-[#0E1522]/95 border-r border-white/10 flex flex-col p-3 gap-4 select-none">
              <div className="flex flex-col gap-1">
                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-3 py-1">Trạng Thái Tải</span>
                {[
                  { id: 'all', label: 'Tất Cả Tác Vụ', count: counts.all, icon: '📦' },
                  { id: 'downloading', label: 'Đang Tải', count: counts.downloading, icon: '⚡', color: 'text-emerald-400' },
                  { id: 'queued', label: 'Hàng Đợi', count: counts.queued, icon: '⏳', color: 'text-amber-400' },
                  { id: 'completed', label: 'Hoàn Thành', count: counts.completed, icon: '✓', color: 'text-cyan-400' },
                  { id: 'paused', label: 'Tạm Dừng', count: counts.paused, icon: '⏸', color: 'text-slate-400' },
                  { id: 'failed', label: 'Lỗi / Hỏng', count: counts.failed, icon: '✕', color: 'text-rose-400' },
                ].map(item => (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => setSelectedCategory(item.id)}
                    className={`flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium transition-all ${
                      selectedCategory === item.id
                        ? 'bg-gradient-to-r from-emerald-500/20 to-cyan-500/20 text-white border border-emerald-500/40 shadow-sm'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'
                    }`}
                  >
                    <div className="flex items-center gap-2">
                      <span>{item.icon}</span>
                      <span className={item.color || 'text-slate-200'}>{item.label}</span>
                    </div>
                    <span className={`text-[11px] font-mono px-1.5 py-0.5 rounded-md ${
                      selectedCategory === item.id ? 'bg-emerald-500 text-black font-bold' : 'bg-slate-800 text-slate-400'
                    }`}>
                      {item.count}
                    </span>
                  </button>
                ))}
              </div>

              <div className="flex flex-col gap-1 border-t border-white/5 pt-3">
                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-3 py-1">Phân Loại</span>
                {[
                  { id: 'anime', label: 'Anime Series', icon: '🎬' },
                  { id: 'video', label: 'Chỉ Video', icon: '📹' },
                  { id: 'subtitle', label: 'Chỉ Phụ Đề', icon: '📝' },
                ].map(sub => (
                  <button
                    key={sub.id}
                    type="button"
                    onClick={() => setSelectedCategory(sub.id)}
                    className={`flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${
                      selectedCategory === sub.id
                        ? 'bg-cyan-950/60 text-cyan-300 border border-cyan-500/40'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'
                    }`}
                  >
                    <span>{sub.icon}</span>
                    <span>{sub.label}</span>
                  </button>
                ))}
              </div>
            </aside>

            {/* Master Table Grid */}
            <main className="flex-1 overflow-x-auto flex flex-col bg-[#0B0F17]">
              {tasks.length === 0 ? (
                <div className="flex-1 flex flex-col items-center justify-center p-12 text-slate-500 gap-3 select-none">
                  <div className="w-16 h-16 rounded-2xl bg-[#161F30] border border-white/10 flex items-center justify-center text-2xl">
                    📦
                  </div>
                  <span className="text-sm font-semibold text-slate-300">Không có tác vụ tải nào</span>
                  <span className="text-xs text-slate-500">Bấm "+ Thêm URL" trên thanh công cụ để bắt đầu tải tập anime mới</span>
                </div>
              ) : (
                <table className="w-full text-left border-collapse select-none">
                  <thead>
                    <tr className="border-b border-white/10 bg-[#131C2D]/80 text-[11px] font-bold uppercase tracking-wider text-slate-400">
                      <th className="py-2.5 px-4">Tác Vụ Anime</th>
                      <th className="py-2.5 px-3">Dung Lượng</th>
                      <th className="py-2.5 px-3 w-48">Tiến Độ</th>
                      <th className="py-2.5 px-3">Trạng Thái</th>
                      <th className="py-2.5 px-3">Tốc Độ</th>
                      <th className="py-2.5 px-3">Còn Lại</th>
                      <th className="py-2.5 px-3 text-right">Thao Tác</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-white/5 text-xs font-mono">
                    {tasks.map(task => (
                      <tr
                        key={task.id}
                        onContextMenu={(e) => {
                          e.preventDefault();
                          setContextMenu({ visible: true, x: e.clientX, y: e.clientY, task });
                        }}
                        onDoubleClick={() => openInspector(task)}
                        className="hover:bg-white/[0.03] transition-colors cursor-pointer group"
                      >
                        <td className="py-3 px-4 font-sans">
                          <div className="flex items-center gap-2.5">
                            <span className="text-base">{task.download_mode === 'sub_only' ? '📝' : '🎬'}</span>
                            <div>
                              <div className="font-semibold text-slate-100 group-hover:text-cyan-300 transition-colors">
                                {task.anime_title} - Tập {task.episode_num}
                              </div>
                              <div className="text-[11px] text-slate-400 font-mono flex items-center gap-2">
                                <span>{task.site.toUpperCase()}</span>
                                <span>•</span>
                                <span>{task.quality}</span>
                                <span>•</span>
                                <span className="text-emerald-400 font-semibold">{task.download_mode.toUpperCase()}</span>
                              </div>
                            </div>
                          </div>
                        </td>

                        <td className="py-3 px-3 text-slate-400">
                          {task.file_size_bytes > 0 ? formatBytes(task.file_size_bytes) : '--'}
                        </td>

                        <td className="py-3 px-3">
                          <div className="flex flex-col gap-1">
                            <div className="flex items-center justify-between text-[11px]">
                              <span className="text-slate-300 font-bold">{task.progress_percent}%</span>
                              {task.total_segments > 0 && (
                                <span className="text-slate-500 text-[10px]">
                                  {task.downloaded_segments}/{task.total_segments} segs
                                </span>
                              )}
                            </div>
                            <div className="w-full h-1.5 rounded-full bg-slate-800 overflow-hidden">
                              <div
                                className={`h-full transition-all duration-300 rounded-full ${
                                  task.status === 'downloading'
                                    ? 'bg-gradient-to-r from-emerald-500 via-cyan-400 to-emerald-400 pulse-gradient-bar'
                                    : task.status === 'completed'
                                    ? 'bg-cyan-500'
                                    : task.status === 'failed'
                                    ? 'bg-rose-500'
                                    : 'bg-slate-600'
                                }`}
                                style={{ width: `${task.progress_percent}%` }}
                              />
                            </div>
                          </div>
                        </td>

                        <td className="py-3 px-3">
                          {task.status === 'downloading' && (
                            <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-emerald-950/70 border border-emerald-500/40 text-emerald-300">
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping" />
                              Đang Tải
                            </span>
                          )}
                          {task.status === 'queued' && (
                            <span className="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-amber-950/70 border border-amber-500/40 text-amber-300">
                              Hàng Đợi
                            </span>
                          )}
                          {task.status === 'completed' && (
                            <span className="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-cyan-950/70 border border-cyan-500/40 text-cyan-300">
                              Hoàn Thành
                            </span>
                          )}
                          {task.status === 'paused' && (
                            <span className="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-slate-800 border border-slate-600 text-slate-400">
                              Tạm Dừng
                            </span>
                          )}
                          {task.status === 'failed' && (
                            <span className="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-rose-950/70 border border-rose-500/40 text-rose-300">
                              Lỗi
                            </span>
                          )}
                        </td>

                        <td className="py-3 px-3 text-emerald-400 font-semibold">
                          {task.status === 'downloading' && task.speed_bytes_per_sec > 0
                            ? `${formatBytes(task.speed_bytes_per_sec)}/s`
                            : '--'}
                        </td>

                        <td className="py-3 px-3 text-slate-400">
                          {task.status === 'downloading' && task.eta_seconds > 0 ? `${task.eta_seconds}s` : '--'}
                        </td>

                        <td className="py-3 px-3 text-right">
                          <div className="flex items-center justify-end gap-1.5" onClick={(e) => e.stopPropagation()}>
                            {task.status === 'downloading' ? (
                              <button
                                type="button"
                                onClick={() => taskAction(task.id, 'pause')}
                                className="p-1 text-slate-400 hover:text-amber-400 hover:bg-white/5 rounded"
                                title="Tạm dừng"
                              >
                                ⏸
                              </button>
                            ) : (
                              <button
                                type="button"
                                onClick={() => taskAction(task.id, 'resume')}
                                className="p-1 text-slate-400 hover:text-emerald-400 hover:bg-white/5 rounded"
                                title="Tiếp tục"
                              >
                                ▶
                              </button>
                            )}
                            <button
                              type="button"
                              onClick={() => openInspector(task)}
                              className="p-1 text-slate-400 hover:text-cyan-400 hover:bg-white/5 rounded"
                              title="Xem chi tiết & logs"
                            >
                              📜
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </main>
          </div>

          {/* Right Click Context Menu */}
          {contextMenu.visible && contextMenu.task && (
            <div
              className="fixed z-50 w-56 bg-[#161F30] border border-white/10 rounded-xl shadow-2xl py-1.5 text-xs text-slate-200 animate-in fade-in zoom-in-95 duration-100"
              style={{ top: `${contextMenu.y}px`, left: `${contextMenu.x}px` }}
              onClick={(e) => e.stopPropagation()}
            >
              {contextMenu.task.status === 'completed' && (
                <button
                  type="button"
                  onClick={() => { taskAction(contextMenu.task.id, 'open-file'); setContextMenu({ visible: false }); }}
                  className="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2"
                >
                  <span>🎬</span> Mở File Video
                </button>
              )}

              <button
                type="button"
                onClick={() => { taskAction(contextMenu.task.id, 'open-folder'); setContextMenu({ visible: false }); }}
                className="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2"
              >
                <span>📁</span> Mở Thư Mục Chứa
              </button>

              <div className="border-t border-white/5 my-1" />

              {contextMenu.task.status === 'downloading' ? (
                <button
                  type="button"
                  onClick={() => { taskAction(contextMenu.task.id, 'pause'); setContextMenu({ visible: false }); }}
                  className="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2 text-amber-300"
                >
                  <span>⏸</span> Tạm Dừng Tác Vụ
                </button>
              ) : (
                <button
                  type="button"
                  onClick={() => { taskAction(contextMenu.task.id, 'resume'); setContextMenu({ visible: false }); }}
                  className="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2 text-emerald-300"
                >
                  <span>▶</span> Tiếp Tục Tải
                </button>
              )}

              <button
                type="button"
                onClick={() => { taskAction(contextMenu.task.id, 'restart'); setContextMenu({ visible: false }); }}
                className="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2 text-cyan-300"
              >
                <span>🔄</span> Tải Lại Từ Đầu
              </button>

              <button
                type="button"
                onClick={() => { openInspector(contextMenu.task); setContextMenu({ visible: false }); }}
                className="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2"
              >
                <span>📜</span> Xem Chi Tiết & Logs
              </button>

              <button
                type="button"
                onClick={() => {
                  if (navigator.clipboard) navigator.clipboard.writeText(contextMenu.task.url);
                  setContextMenu({ visible: false });
                }}
                className="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2 text-slate-400"
              >
                <span>🔗</span> Sao Chép URL Nguồn
              </button>

              <div className="border-t border-white/5 my-1" />

              <button
                type="button"
                onClick={() => { taskAction(contextMenu.task.id, 'delete', { deleteFile: false }); setContextMenu({ visible: false }); }}
                className="w-full text-left px-3.5 py-1.5 hover:bg-rose-950/40 text-rose-300 flex items-center gap-2"
              >
                <span>🗑</span> Xóa Khỏi Danh Sách
              </button>

              <button
                type="button"
                onClick={() => { taskAction(contextMenu.task.id, 'delete', { deleteFile: true }); setContextMenu({ visible: false }); }}
                className="w-full text-left px-3.5 py-1.5 hover:bg-rose-950/60 text-rose-400 font-semibold flex items-center gap-2"
              >
                <span>⚠️</span> Xóa Cả File Trên Ổ Đĩa
              </button>
            </div>
          )}

          {/* Add URL / Parse Modal */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#05080E]/80 backdrop-blur-md">
              <div className="relative w-full max-w-2xl bg-[#161F30] border border-white/10 rounded-2xl shadow-2xl overflow-hidden p-6 flex flex-col gap-5 animate-in fade-in zoom-in-95 duration-150">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    <span>⚡</span> Thêm Tác Vụ Tải Anime Mới
                  </h2>
                  <button type="button" onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-white p-1 rounded-lg">✕</button>
                </div>

                {!parsedData ? (
                  <form onSubmit={handleParse} className="flex flex-col gap-4">
                    {/* Site Presets */}
                    <div className="flex flex-wrap gap-2">
                      {SITE_PRESETS.map(p => (
                        <button
                          key={p.id}
                          type="button"
                          onClick={() => { setUrl(p.sample); }}
                          className={`text-xs px-2.5 py-1 rounded-lg border font-mono transition-all ${p.color}`}
                        >
                          + {p.name}
                        </button>
                      ))}
                    </div>

                    <div className="flex items-center gap-2">
                      <input
                        type="text"
                        value={url}
                        onChange={(e) => setUrl(e.target.value)}
                        placeholder="Dán link Anime (AllWish, AniKoto, AnimeSuge, AnimeCube)..."
                        className="flex-1 bg-[#0B0F17] text-slate-200 text-sm px-4 py-3 rounded-xl border border-white/10 focus:border-cyan-400 focus:outline-none"
                      />
                      <button
                        type="submit"
                        disabled={!url.trim() || isParsing}
                        className="px-6 py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-sm shadow-md disabled:opacity-50"
                      >
                        {isParsing ? 'Đang phân tích...' : '1-Click Parse'}
                      </button>
                    </div>

                    {parseError && (
                      <div className="text-xs text-rose-400 bg-rose-950/40 border border-rose-800/30 p-3 rounded-xl">
                        {parseError}
                      </div>
                    )}
                  </form>
                ) : (
                  <div className="flex flex-col gap-4">
                    {/* Extracted Details */}
                    <div className="p-4 bg-[#0E1522] rounded-xl border border-white/5">
                      <span className="text-[10px] text-emerald-400 font-mono uppercase font-semibold">STREAM EXTRACTED ({parsedData.site.toUpperCase()})</span>
                      <h3 className="text-base font-bold text-slate-100">{parsedData.title}</h3>
                      <span className="text-xs text-slate-400 font-mono">{parsedData.totalEpisodes} tập có sẵn</span>
                    </div>

                    {/* Mode Selector */}
                    <div className="grid grid-cols-3 gap-2 bg-[#0B0F17] p-1.5 rounded-xl border border-white/5">
                      <button
                        type="button"
                        onClick={() => setDownloadMode('full')}
                        className={`py-2 px-3 rounded-lg text-xs font-semibold ${downloadMode === 'full' ? 'bg-gradient-to-r from-emerald-500 to-cyan-500 text-white' : 'text-slate-400'}`}
                      >
                        Full (Video + Sub)
                      </button>
                      <button
                        type="button"
                        onClick={() => setDownloadMode('sub_only')}
                        className={`py-2 px-3 rounded-lg text-xs font-semibold ${downloadMode === 'sub_only' ? 'bg-gradient-to-r from-cyan-500 to-blue-500 text-white' : 'text-slate-400'}`}
                      >
                        Chỉ Tải Sub (Sub-Only)
                      </button>
                      <button
                        type="button"
                        onClick={() => setDownloadMode('video_only')}
                        className={`py-2 px-3 rounded-lg text-xs font-semibold ${downloadMode === 'video_only' ? 'bg-gradient-to-r from-purple-500 to-indigo-500 text-white' : 'text-slate-400'}`}
                      >
                        Chỉ Tải Video (No Sub)
                      </button>
                    </div>

                    {/* Episode Range */}
                    <div className="flex flex-col gap-1.5">
                      <label className="text-xs text-slate-300 font-semibold">Chọn Tập</label>
                      <input
                        type="text"
                        value={rangeInput}
                        onChange={(e) => setRangeInput(e.target.value)}
                        placeholder="all hoặc 1-12 hoặc 1,3,5"
                        className="bg-[#0B0F17] text-slate-200 text-sm px-3.5 py-2 rounded-xl border border-white/10"
                      />
                    </div>

                    {/* Actions */}
                    <div className="flex items-center justify-end gap-3 pt-2">
                      <button
                        type="button"
                        onClick={() => setParsedData(null)}
                        className="px-4 py-2 text-xs text-slate-400 hover:text-white"
                      >
                        Quay Lại
                      </button>
                      <button
                        type="button"
                        onClick={handleConfirmAdd}
                        className="px-6 py-2.5 rounded-xl font-semibold text-white bg-gradient-to-r from-emerald-500 to-cyan-500 text-xs shadow-lg"
                      >
                        Thêm Vào Hàng Đợi Tải
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Task Inspector Modal */}
          {taskDetail && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#05080E]/80 backdrop-blur-md">
              <div className="relative w-full max-w-3xl bg-[#161F30] border border-white/10 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in fade-in zoom-in-95 duration-150">
                <div className="flex items-center justify-between px-6 py-4 border-b border-white/10 bg-[#131C2D]/80">
                  <div>
                    <span className="text-[10px] uppercase tracking-wider font-semibold text-cyan-400 font-mono">Task Inspector & Per-Task Log</span>
                    <h2 className="text-base font-bold text-slate-100">{taskDetail.anime_title} - Tập {taskDetail.episode_num}</h2>
                  </div>
                  <button type="button" onClick={() => setTaskDetail(null)} className="text-slate-400 hover:text-white p-1 rounded-lg">✕</button>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 p-4 bg-[#0E1522]/80 border-b border-white/5 text-xs font-mono">
                  <div>
                    <span className="text-slate-500 block text-[10px]">TRẠNG THÁI</span>
                    <span className="font-bold text-emerald-400 uppercase">{taskDetail.status}</span>
                  </div>
                  <div>
                    <span className="text-slate-500 block text-[10px]">SITE NGUỒN</span>
                    <span className="text-slate-200 uppercase">{taskDetail.site}</span>
                  </div>
                  <div>
                    <span className="text-slate-500 block text-[10px]">CHẾ ĐỘ TẢI</span>
                    <span className="text-cyan-300 uppercase">{taskDetail.download_mode}</span>
                  </div>
                  <div>
                    <span className="text-slate-500 block text-[10px]">TIẾN ĐỘ</span>
                    <span className="text-amber-300 font-bold">{taskDetail.progress_percent}%</span>
                  </div>
                </div>

                <div className="flex-1 flex flex-col p-4 overflow-hidden gap-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-300 uppercase tracking-wider">Nhật Ký Tác Vụ ({taskLogs.length} logs)</span>
                    <button
                      type="button"
                      onClick={() => {
                        const txt = taskLogs.map(l => `[${new Date(l.timestamp * 1000).toLocaleTimeString()}] [${l.level}] [${l.category.toUpperCase()}] ${l.message}`).join('\n');
                        if (navigator.clipboard) { navigator.clipboard.writeText(txt); alert('Đã sao chép logs tác vụ!'); }
                      }}
                      className="px-2.5 py-1 text-[11px] rounded bg-cyan-500/20 text-cyan-300 hover:bg-cyan-500/30 border border-cyan-500/40 transition-all font-mono"
                    >
                      📋 Sao Chép Logs Tác Vụ
                    </button>
                  </div>
                  <div className="flex-1 overflow-y-auto bg-[#070A10] border border-white/5 rounded-xl p-3 font-mono text-[11px] space-y-1 select-text">
                    {taskLogs.length === 0 ? (
                      <div className="text-slate-600">Chưa có nhật ký cho tác vụ này.</div>
                    ) : (
                      taskLogs.map(l => (
                        <div key={l.id} className="flex items-start gap-2 hover:bg-white/[0.03] px-1.5 py-0.5 rounded">
                          <span className="text-slate-500 shrink-0">[{new Date(l.timestamp * 1000).toLocaleTimeString()}]</span>
                          <span className={`font-semibold shrink-0 uppercase ${l.level === 'ERROR' ? 'text-rose-400' : 'text-cyan-400'}`}>[{l.level}]</span>
                          <span className="text-slate-300 break-all">{l.message}</span>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="flex items-center justify-between px-6 py-3 border-t border-white/10 bg-[#131C2D]/80">
                  <div className="flex items-center gap-2">
                    <button type="button" onClick={() => taskAction(taskDetail.id, 'open-folder')} className="px-3 py-1.5 text-xs text-slate-300 hover:text-white bg-[#161F30] rounded-lg">📁 Mở Thư Mục</button>
                    {taskDetail.status === 'completed' && (
                      <button type="button" onClick={() => taskAction(taskDetail.id, 'open-file')} className="px-3 py-1.5 text-xs text-emerald-300 bg-emerald-950/40 border border-emerald-500/40 rounded-lg">🎬 Mở Video</button>
                    )}
                  </div>
                  <button type="button" onClick={() => setTaskDetail(null)} className="px-4 py-1.5 text-xs text-white bg-slate-800 hover:bg-slate-700 rounded-lg">Đóng</button>
                </div>
              </div>
            </div>
          )}

          {/* System Settings Drawer */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#05080E]/80 backdrop-blur-md">
              <div className="relative w-full max-w-md bg-[#161F30] border border-white/10 rounded-2xl shadow-2xl p-6 flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-150">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <h3 className="text-sm font-bold text-slate-100">Cấu Hình Download Manager</h3>
                  <button type="button" onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="flex flex-col gap-3 text-xs">
                  <div>
                    <label className="text-slate-400">Thư mục tải về mặc định</label>
                    <input
                      type="text"
                      value={settings.outputDir}
                      onChange={(e) => setSettings({ ...settings, outputDir: e.target.value })}
                      className="w-full mt-1 bg-[#0B0F17] text-slate-200 px-3 py-2 rounded-lg border border-white/10"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400">Giới hạn tải đồng thời (Max Workers: {settings.maxWorkers})</label>
                    <input
                      type="range"
                      min="1"
                      max="16"
                      value={settings.maxWorkers}
                      onChange={(e) => {
                        const val = parseInt(e.target.value, 10);
                        setSettings({ ...settings, maxWorkers: val });
                        fetch('/api/queue/config', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ maxConcurrent: val })
                        });
                      }}
                      className="w-full mt-2 accent-emerald-400"
                    />
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setIsSettingsOpen(false)}
                  className="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-cyan-500 text-white text-xs font-bold rounded-xl"
                >
                  Lưu & Đóng
                </button>
              </div>
            </div>
          )}

          {/* System Console Logs Drawer */}
          <div className={`fixed bottom-0 left-0 right-0 z-40 transition-all ${isConsoleOpen ? 'h-72' : 'h-9'} bg-[#0B0F17]/95 border-t border-white/10 flex flex-col`}>
            <div onClick={() => setIsConsoleOpen(!isConsoleOpen)} className="flex items-center justify-between px-4 py-2 bg-[#161F30] cursor-pointer text-xs select-none">
              <div className="flex items-center gap-3">
                <span className="font-mono text-cyan-400 font-bold flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 9l3 3-3 3m5 0h3" /></svg>
                  SYSTEM SESSION LOGS ({systemLogs.length})
                </span>
                <span className="text-[10px] text-slate-400 font-mono hidden sm:inline">(Có thể bôi đen & sao chép trực tiếp)</span>
              </div>

              <div className="flex items-center gap-2">
                {isConsoleOpen && (
                  <>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        const txt = systemLogs.map(l => `[${new Date(l.timestamp * 1000 || Date.now()).toLocaleTimeString()}] [${(l.category || 'GENERAL').toUpperCase()}] ${l.message}`).join('\n');
                        if (navigator.clipboard) { navigator.clipboard.writeText(txt); alert('Đã sao chép toàn bộ logs hệ thống!'); }
                      }}
                      className="px-2.5 py-0.5 text-[11px] rounded bg-cyan-500/20 text-cyan-300 hover:bg-cyan-500/30 border border-cyan-500/40 transition-all font-mono"
                    >
                      📋 Sao Chép Logs
                    </button>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setSystemLogs([]);
                        fetch('/api/logs/clear', { method: 'POST' });
                      }}
                      className="px-2 py-0.5 text-[11px] rounded bg-rose-950/40 text-rose-300 hover:bg-rose-950/60 border border-rose-800/40 transition-all"
                    >
                      Xóa
                    </button>
                  </>
                )}
                <span className="text-slate-400">{isConsoleOpen ? '▼ Thu gọn' : '▲ Mở rộng'}</span>
              </div>
            </div>

            {isConsoleOpen && (
              <div className="flex-1 p-3 overflow-y-auto font-mono text-[11px] space-y-1 bg-[#070A10] select-text">
                {systemLogs.length === 0 ? (
                  <div className="text-slate-600">Chưa có nhật ký ghi nhận.</div>
                ) : (
                  systemLogs.map(l => (
                    <div key={l.id} className="flex items-start gap-2 select-text hover:bg-white/[0.03] px-2 py-0.5 rounded cursor-text">
                      <span className="text-slate-500 shrink-0 select-text">[{new Date(l.timestamp * 1000 || Date.now()).toLocaleTimeString()}]</span>
                      <span className="text-emerald-400 font-semibold uppercase shrink-0 select-text">[{l.category || 'GENERAL'}]</span>
                      <span className="text-slate-300 break-all select-text">{l.message}</span>
                    </div>
                  ))
                )}
              </div>
            )}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
